[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-twins"
version = "0.1.0"
description = "Exact finite graph-invariant experiments with reproducible witnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = ["streamlit>=1.50", "networkx>=3.5", "numpy>=2.0"]

[project.urls]
Repository = "https://github.com/denizguneey/invariant-twins"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
