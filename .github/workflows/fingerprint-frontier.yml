name: Fingerprint Frontier Research

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Curated fingerprint preset
        required: true
        default: F6
        type: choice
        options: [F1, F2, F3, F4, F5, F6, F7, F8, F9, F10]
      max_order:
        description: Largest order to exhaustively check
        required: true
        default: '8'
        type: string

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y nauty
      - run: command -v nauty-geng || command -v geng
      - run: |
          generator=$(command -v nauty-geng || command -v geng)
          test "$($generator -cq 5 | sed '/^$/d' | wc -l)" -eq 21
      - run: python scripts/run_frontier.py --preset "${{ inputs.preset }}" --max-order "${{ inputs.max_order }}"
      - run: PYTHONPATH=. pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-frontier-${{ inputs.preset }}-n${{ inputs.max_order }}
          path: artifacts/frontier-${{ inputs.preset }}-n${{ inputs.max_order }}.*
